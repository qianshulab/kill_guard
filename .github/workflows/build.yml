name: Build kill_guard with OnePlus kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc libssl-dev

      - name: Clone OnePlus SM8845 kernel
        run: |
          cd /tmp
          git clone --depth 1 --branch oneplus/sm8845_b_16.0.0_ace_6t \
            --single-branch \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8845.git kernel
          cd kernel
          echo "Kernel version: $(grep 'VERSION\|PATCHLEVEL\|SUBLEVEL' Makefile | head -3)"

      - name: Configure kernel
        run: |
          cd /tmp/kernel
          cp $GITHUB_WORKSPACE/device_config.txt .config
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --disable CONFIG_MODULE_SIG
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kill_guard
        run: |
          cd /tmp/kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc) 2>&1 | tail -3

          mkdir -p /tmp/modbuild
          cp $GITHUB_WORKSPACE/kill_guard.c /tmp/modbuild/
          printf 'obj-m += kill_guard.o\nKDIR := /tmp/kernel\nall:\n\t$(MAKE) -C $(KDIR) M=$(PWD) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_MODPOST_WARN=1 modules\n' > /tmp/modbuild/Makefile

          cd /tmp/modbuild
          make 2>&1 | tail -15
          ls -la kill_guard.ko
          file kill_guard.ko
          strings kill_guard.ko | grep vermagic

          # 检查 struct module 大小
          python3 -c "
          import struct
          data = open('kill_guard.ko','rb').read()
          e_shoff = struct.unpack_from('<Q', data, 0x28)[0]
          e_shentsize = struct.unpack_from('<H', data, 0x3a)[0]
          e_shnum = struct.unpack_from('<H', data, 0x3c)[0]
          e_shstrndx = struct.unpack_from('<H', data, 0x3e)[0]
          shstr_off = e_shoff + e_shstrndx * e_shentsize
          shstr_offset = struct.unpack_from('<Q', data, shstr_off + 0x18)[0]
          for i in range(e_shnum):
              off = e_shoff + i * e_shentsize
              name_off = struct.unpack_from('<I', data, off)[0]
              sh_size = struct.unpack_from('<Q', data, off + 0x20)[0]
              end = data.index(0, shstr_offset + name_off)
              name = data[shstr_offset+name_off:end].decode('ascii', errors='replace')
              if 'this_module' in name:
                  print(f'this_module size: {sh_size} bytes (device expects 1600)')
                  break
          "

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kill_guard-oplus
          path: /tmp/modbuild/kill_guard.ko
          retention-days: 30
