name: Build kill_guard (linker patch)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc libssl-dev

      - name: Build module (generic kernel)
        run: |
          cd /tmp
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.38.tar.xz
          tar xf linux-6.12.38.tar.xz
          cd linux-6.12.38
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config --enable CONFIG_MODULES --enable CONFIG_KPROBES --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --disable CONFIG_MODULE_SIG --disable CONFIG_DEBUG_INFO --disable CONFIG_DEBUG_INFO_BTF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc) 2>&1 | tail -3

          mkdir -p /tmp/modbuild && cd /tmp/modbuild
          cp $GITHUB_WORKSPACE/kill_guard.c .
          printf 'obj-m += kill_guard.o\nKDIR := /tmp/linux-6.12.38\nall:\n\t$(MAKE) -C $(KDIR) M=$(PWD) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_MODPOST_WARN=1 modules\n' > Makefile
          make 2>&1 | tail -5
          ls -la kill_guard.ko && echo "BUILD OK"

      - name: Patch for OnePlus (1600 byte struct module + vermagic)
        run: |
          cd /tmp/modbuild

          # 方法：解构 .ko → 修改 → 重新链接
          # 1. 解构所有 section 到文件
          aarch64-linux-gnu-objcopy -O binary --only-section=.gnu.linkonce.this_module kill_guard.ko this_module.bin
          OLD_SIZE=$(stat -c%s this_module.bin)
          TARGET_SIZE=1600
          PAD=$((TARGET_SIZE - OLD_SIZE))
          echo "this_module: $OLD_SIZE → $TARGET_SIZE (pad $PAD)"

          # 2. 扩展 this_module 数据（在末尾追加零，保持 .init/.exit 等字段位置）
          cp this_module.bin this_module_padded.bin
          truncate -s $TARGET_SIZE this_module_padded.bin

          # 3. 解构 .modinfo
          aarch64-linux-gnu-objcopy -O binary --only-section=.modinfo kill_guard.ko modinfo.bin
          # 替换 vermagic
          python3 -c "
          data = open('modinfo.bin','rb').read()
          old = b'vermagic=6.12.38 SMP preempt mod_unload aarch64'
          new = b'vermagic=6.12.38-android16-5-g844001fb8721-ab14552068-4k SMP preempt mod_unload modversions aarch64'
          data = data.replace(old, new)
          open('modinfo_new.bin','wb').write(data)
          "

          # 4. 重新构建 .ko：用 objcopy 的 --update-section
          cp kill_guard.ko kill_guard_patched.ko

          # 更新 this_module section
          aarch64-linux-gnu-objcopy \
            --update-section .gnu.linkonce.this_module=this_module_padded.bin \
            kill_guard_patched.ko kill_guard_patched.ko

          # 更新 modinfo section
          aarch64-linux-gnu-objcopy \
            --update-section .modinfo=modinfo_new.bin \
            kill_guard_patched.ko kill_guard_patched.ko

          # 5. 验证
          ls -la kill_guard_patched.ko
          aarch64-linux-gnu-readelf -S kill_guard_patched.ko | grep -E "this_module|modinfo"
          strings kill_guard_patched.ko | grep vermagic

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kill_guard-oneplus
          path: /tmp/modbuild/kill_guard_patched.ko
          retention-days: 30
